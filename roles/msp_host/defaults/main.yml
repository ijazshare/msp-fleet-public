msp_agent_user: msp-agent
msp_box_host: ""                 # inventory name of this site's box (its llm keys are registered here)
msp_never_stage: []              # from group_vars/<site>.yml: never staged, whatever the label
msp_deny_stage:                  # need label DESTRUCTIVE
  - destroy
  - "rm -rf"
  - wipefs
  - mkfs
  - "dd "
  - purge
  - rollback
  - "zfs receive -F"
msp_root_key_only: false        # true once the ops key is proven on the host: root password login off
msp_operator_pubkeys: []         # same list as the box: names the human in receipts (from group_vars/<site>.yml)
msp_service_allowlist: []        # systemd units the broker may restart (exact names, one per line)
msp_interpreter_allowlist: [bash, sh, python3]   # interpreters an approved frozen script may use
msp_broker_operations: []        # operations the broker key may run on THIS host; empty refuses everything
