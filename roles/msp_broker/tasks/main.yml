- name: Client identity is set
  ansible.builtin.assert:
    that:
      - msp_broker_client_id | length > 0
      - msp_broker_client_name | length > 0
    fail_msg: "set msp_broker_client_id and msp_broker_client_name in group_vars/<site>.yml"

- name: Python and ssh for the broker
  ansible.builtin.apt:
    name: [python3, openssh-client]
    state: present

- name: Approver and broker socket groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: [msp-approvers, msp-broker]

- name: The llm user may reach the socket (not approve)
  ansible.builtin.user:
    name: "{{ msp_llm_user | default('llm') }}"
    groups: msp-broker
    append: true

- name: Approver accounts
  ansible.builtin.user:
    name: "{{ item }}"
    groups: msp-broker
    append: true
    shell: /bin/bash
    create_home: true
    password: "!"
  loop: "{{ msp_broker_approvers }}"

- name: Approver keys
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    key: "{{ item.1 }}"
    comment: approver
  loop: "{{ msp_broker_approvers | product(msp_broker_approver_pubkeys) | list }}"
  when: msp_broker_approver_pubkeys | length > 0

- name: Broker directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/msp/secrets, mode: "0700"}
    - {path: /var/lib/msp-broker, mode: "0700"}
    - {path: /var/lib/msp-broker/proposals, mode: "0700"}
    - {path: /var/lib/msp-broker/receipts, mode: "0700"}
    - {path: /var/log/msp-broker, mode: "0700"}

- name: Broker code (root-owned; the llm user can read, not write)
  ansible.builtin.copy:
    src: broker
    dest: /usr/local/lib/msp-broker/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Broker commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    owner: root
    group: root
    mode: "0755"
  loop: [msp-action, msp-read, msp-approve, msp-brokerd]

- name: Broker key to the hypervisors (root-only; the llm user can never read it)
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -N "" -C "broker@{{ inventory_hostname }}" -f {{ msp_broker_proxmox_key }}
    creates: "{{ msp_broker_proxmox_key }}"

- name: Broker key permissions
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - "{{ msp_broker_proxmox_key }}"
    - "{{ msp_broker_proxmox_key }}.pub"

- name: Hypervisor host key, pinned before the broker ever connects
  when: msp_broker_proxmox_target != '' and msp_broker_proxmox_host != ''
  block:
    - name: Read the hypervisor host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ msp_broker_proxmox_target }}"
      register: broker_hostkey
    - name: known_hosts for the broker (no trust on first use)
      ansible.builtin.known_hosts:
        path: "{{ msp_broker_proxmox_known_hosts }}"
        name: "{{ msp_broker_proxmox_host }}"
        key: "{{ msp_broker_proxmox_host }} {{ (broker_hostkey.content | b64decode).split()[0:2] | join(' ') }}"
    - name: known_hosts is world-readable (no secrets in it)
      ansible.builtin.file:
        path: "{{ msp_broker_proxmox_known_hosts }}"
        owner: root
        group: root
        mode: "0644"

- name: Proxmox adapter needs its connection details
  ansible.builtin.assert:
    that:
      - msp_broker_proxmox_host | length > 0
      - msp_broker_proxmox_target | length > 0
    fail_msg: "set msp_broker_proxmox_host and msp_broker_proxmox_target in group_vars/<site>.yml"
  when: msp_broker_adapters.proxmox is defined and msp_broker_adapters.proxmox.enabled | default(false)

- name: Policy adapters, with the proxmox connection folded in
  ansible.builtin.set_fact:
    msp_broker_policy_adapters: >-
      {%- if msp_broker_adapters.proxmox is defined -%}
      {{ msp_broker_adapters | combine({'proxmox': msp_broker_adapters.proxmox | combine({
           'host': msp_broker_proxmox_host, 'user': msp_broker_proxmox_user,
           'key': msp_broker_proxmox_key, 'known_hosts': msp_broker_proxmox_known_hosts})}) }}
      {%- else -%}
      {{ msp_broker_adapters }}
      {%- endif -%}

- name: Client identity file
  ansible.builtin.template:
    src: client.conf.j2
    dest: /etc/msp/client.conf
    owner: root
    group: root
    mode: "0644"

- name: Policy (root-owned; the AI cannot modify)
  ansible.builtin.template:
    src: policy.json.j2
    dest: /etc/msp/policy.json
    owner: root
    group: root
    mode: "0644"

- name: Inventory seed
  ansible.builtin.template:
    src: inventory.json.j2
    dest: /etc/msp/inventory.json
    owner: root
    group: root
    mode: "0644"

- name: Policy must load before the service starts
  ansible.builtin.command: /usr/local/bin/msp-brokerd --check
  changed_when: false

- name: Broker service
  ansible.builtin.template:
    src: msp-broker.service.j2
    dest: /etc/systemd/system/msp-broker.service
    owner: root
    group: root
    mode: "0644"
  notify: restart-msp-broker

- name: Broker enabled and running
  ansible.builtin.systemd:
    name: msp-broker
    enabled: true
    state: started
    daemon_reload: true
