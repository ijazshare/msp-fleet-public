# Site box tmux for the llm user. Plan = blue. Scratch = magenta, nothing there is kept.
set -g default-terminal "tmux-256color"
set -g history-limit 50000
set -g mouse on
set -g set-clipboard on            # forward OSC 52 copies to the laptop terminal (WezTerm/Kitty)
set -g allow-passthrough on
set -g base-index 1
set -g renumber-windows on
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 80
# status bar colour follows the current window name
set -g status-style '#{?#{==:#W,scratch},bg=colour125 fg=colour231,bg=colour25 fg=colour231}'
set -g status-left '#{?#{==:#W,scratch},#[bold] SCRATCH · nothing here is kept ,#[bold] PLAN · #{host_short} · notes are kept }'
set -g status-right ' %Y-%m-%d %H:%M %Z '
set -g window-status-current-style 'bold reverse'
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style '#{?#{==:#W,scratch},fg=colour125,fg=colour25}'
bind-key -n M-1 select-window -t plan
bind-key -n M-2 select-window -t scratch
