# Build or repair a site. Idempotent: a second run changes nothing.
#   ansible-playbook playbooks/site.yml -l SITE
- name: Site box
  hosts: box
  roles:
    - msp_checks
    - role: msp_snmp
      when: msp_snmp | default(false)
    - msp_box
    - role: msp_tools
      when: msp_tools_install | default(true)

- name: Hypervisors
  hosts: pve_hosts
  roles:
    - msp_checks
    - role: msp_snmp
      when: msp_snmp | default(false)
    - role: msp_host
      when: msp_gate | default(true)

- name: Box knows the hypervisors by their real host keys
  hosts: box
  tasks:
    - name: Gated hypervisors at this site (the box only ever talks to these)
      ansible.builtin.set_fact:
        msp_gated_hosts: >-
          {%- set l = [] -%}
          {%- for h in groups['pve_hosts'] if hostvars[h].site == site and (hostvars[h].msp_gate | default(true)) -%}
            {%- set _ = l.append(h) -%}
          {%- endfor -%}
          {{ l }}
    - name: Read each gated hypervisor's host key
      ansible.builtin.slurp:
        src: /etc/ssh/ssh_host_ed25519_key.pub
      delegate_to: "{{ item }}"
      register: hk
      loop: "{{ msp_gated_hosts }}"
    - name: known_hosts for llm and for the checks
      ansible.builtin.known_hosts:
        path: "{{ item.1 }}"
        name: "{{ hostvars[item.0.item].ansible_host }}"
        key: "{{ hostvars[item.0.item].ansible_host }} {{ (item.0.content | b64decode).split()[0:2] | join(' ') }}"
      loop: "{{ hk.results | product(['/home/' ~ (msp_llm_user | default('llm')) ~ '/.ssh/known_hosts', '/var/lib/msp/known_hosts']) | list }}"
      loop_control:
        label: "{{ item.0.item }} -> {{ item.1 }}"
    - name: llm owns its known_hosts
      ansible.builtin.file:
        path: /home/{{ msp_llm_user | default('llm') }}/.ssh/known_hosts
        owner: "{{ msp_llm_user | default('llm') }}"
        group: "{{ msp_llm_user | default('llm') }}"
        mode: "0644"
