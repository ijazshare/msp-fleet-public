# Copy to group_vars/<site>.yml (bin/new-site does it for you). Everything client-specific lives here.
msp_baseline:
  guests.exclude: ""                # VMIDs that must never appear in any dump, state file, read or note
  # disk.warn: 80                   # filesystem thresholds (%)
  # disk.crit: 90
  # smart.wear_warn: 90             # NVMe percentage_used that is a WARN
  # time.warn_ms: 200               # chrony offset thresholds
  # time.crit_ms: 2000
  # time.allow_unsynced: "false"
  # backup.paths: /mnt/backup/*     # newest file under these dirs/globs; empty = check off
  # backup.warn_age: 93600
  # backup.crit_age: 180000
msp_repo_url: git@github.com:ORG/CLIENT-REPO.git   # the client's own record; the box pushes session notes there
# Broker (approval-gated changes). client_id/client_name appear on the technician's approval card.
# msp_broker: true                                # off by default; nothing below applies until it is on
# msp_broker_client_id: client_abc
# msp_broker_client_name: ABC Accounting
# msp_broker_approvers: [msp-tech]                 # Unix accounts that may approve; keys below log into them
# msp_broker_approver_pubkeys:
#   - "ssh-ed25519 AAAA... tech@laptop"
# msp_broker_ttl_seconds: 300                      # how long a proposal may wait for approval
# msp_broker_adapters:
#   proxmox: {enabled: true, operations: [vm.start, vm.shutdown, vm.reboot, vm.stop, ct.start, ct.shutdown, ct.reboot, ct.stop, zpool.scrub, service.restart]}
#   mock: {enabled: false, operations: []}
# msp_broker_proxmox_host: 192.0.2.1                   # the gated hypervisor's address
# msp_broker_proxmox_target: SITE-pve                  # its inventory name (its host key is pinned at deploy)
# msp_service_allowlist: [smbd, chrony]                # on the hypervisor: units the broker may restart
# msp_broker_operations: [vm.start, vm.shutdown, vm.reboot, vm.stop, ct.start, ct.shutdown, ct.reboot, ct.stop, zpool.scrub, service.restart]
#                                                      # on the hypervisor: the ONLY operations the broker key may run there; empty refuses all
# msp_broker_inventory: []                         # stable IDs; the proxmox adapter fills this from the host
# msp_broker_script: {enabled: false, max_bytes: 65536, default_timeout_seconds: 600, max_timeout_seconds: 1800, interpreters: [bash, sh, python3], forbidden_patterns: []}
# msp_broker_plans: {enabled: true, max_steps: 8}
# msp_tools_enabled: [claude, opencode]           # terminal agents on the box (claude, agy, opencode); agy reports telemetry until switched off in its /config
msp_never_stage:                    # never staged, whatever the label (case-insensitive substring match)
  - "zpool destroy"
  - "wipefs"
  - "mkfs"
  - "dd of=/dev/"
msp_client_rules: |
  Site rules for the AI, appended to AGENTS.md. Say what is production, what is a lab, what is never touched.
msp_operator_pubkeys:               # who may open the Exec seat; receipts name the approver by the key's comment
  - "ssh-ed25519 AAAA... ops@laptop"
# Notification and on-site monitoring (all optional; Healthchecks pings are the default):
# msp_webhook_url: https://...                     # JSON POST on every event
# msp_snmptrap_target: 192.0.2.1                   # SNMPv2c trap on a page or a state change
# msp_snmp: true                                   # read-only SNMP agent for the client's NMS
# msp_snmp_bind: udp:192.0.2.1:161
# msp_snmp_rocommunity: <community>
# msp_snmp_allowed: 192.0.2.1/24